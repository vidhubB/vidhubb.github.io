<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidHub - Upload</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/upload.css">
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div id="sidebar"></div>
        <main class="main-content">
            <div class="upload-container">
                <h1>Upload Video</h1>
                <form id="uploadForm">
                    <div class="upload-area" id="dropZone">
                        <input type="file" id="videoFile" accept="video/*" hidden>
                        <div class="upload-placeholder">
                            <span class="upload-icon">📹</span>
                            <p>Drag and drop video or click to select</p>
                            <p class="file-name" id="fileName"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="Video title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="5" placeholder="Video description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="thumbnail">Video Thumbnail</label>
                        <input type="file" id="thumbnail" accept="image/*">
                        <img id="thumbnailPreview" style="display:none; max-width: 320px; margin-top: 10px; border-radius: 8px;">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Music">Music</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Tutorials">Tutorials</option>
                            <option value="News">News</option>
                            <option value="Vlogs">Vlogs</option>
                            <option value="Documentaries">Documentaries</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="publish-btn">Publish</button>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
