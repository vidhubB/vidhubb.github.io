<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidHub - Channel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/channel.css">
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div id="sidebar"></div>
        <main class="main-content">
            <div class="channel-banner" id="channelBanner"></div>
            <div class="channel-header">
                <img id="channelAvatar" src="assets/default-avatar.png" alt="Channel" class="channel-avatar-large">
                <div class="channel-details">
                    <h1 id="channelName"></h1>
                    <p id="channelSubs"></p>
                </div>
                <button id="subscribeBtn" class="subscribe-btn">Subscribe</button>
            </div>
            <div class="channel-tabs">
                <button class="tab-btn active" data-tab="videos">Videos</button>
                <button class="tab-btn" data-tab="playlists">Playlists</button>
                <button class="tab-btn" data-tab="about">About</button>
            </div>
            <div id="channelVideos" class="video-grid"></div>
            <div id="channelPlaylists" class="playlists-grid" style="display:none;"></div>
            <div id="channelAbout" style="display:none;">
                <p>Channel created on: <span id="channelCreated"></span></p>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/channel.js"></script>
</body>
</html>
